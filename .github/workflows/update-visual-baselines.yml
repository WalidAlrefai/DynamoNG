name: Update Visual Baselines

on:
  workflow_dispatch:
    inputs:
      open_pr:
        description: 'Also open a PR with the regenerated baselines (otherwise: artifact only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps

      # Must run here (real ubuntu-latest), never locally/Docker — a local
      # approximation is exactly what produced the stale, font-mismatched
      # baselines this workflow exists to replace. Writes missing baselines
      # and overwrites stale ones for every case/browser project.
      - run: npx nx e2e demo -- --update-snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ github.run_id }}
          path: apps/demo/e2e/components-visual.spec.ts-snapshots/**
          retention-days: 14

      - if: inputs.open_pr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'test(demo): update visual regression baselines'
          branch: update-visual-baselines-${{ github.run_id }}
          title: 'Update visual regression baselines'
          body: >
            Auto-generated by the "Update Visual Baselines" workflow
            (run ${{ github.run_id }}) on ubuntu-latest.
          add-paths: apps/demo/e2e/components-visual.spec.ts-snapshots
