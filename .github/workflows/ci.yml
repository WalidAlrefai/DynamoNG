name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps

      - run: npx nx format:check --base=origin/${{ github.base_ref }}

      # Only touched projects and their dependents run — keeps PR CI fast
      # even as the component count grows toward 100+.
      - run: npx nx affected -t lint test build build-css e2e --base=origin/${{ github.base_ref }} --parallel=3

  main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps

      # Full workspace validation before anything is published from main.
      - run: npx nx run-many -t lint test build build-css e2e --parallel=3
