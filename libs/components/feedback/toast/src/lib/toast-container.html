<div [class]="containerClasses" role="status" aria-live="polite">
  @for (toast of toasts(); track toast.id) {
  <div [class]="cardClasses(toast.severity)">
    <svg
      [class]="iconClasses(toast.severity)"
      [attr.aria-hidden]="true"
      viewBox="0 0 20 20"
      fill="currentColor"
    >
      @switch (toast.severity) { @case ('success') {
      <path
        fill-rule="evenodd"
        d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
        clip-rule="evenodd"
      />
      } @case ('warning') {
      <path
        fill-rule="evenodd"
        d="M8.257 3.099c.765-1.36 2.72-1.36 3.486 0l6.28 11.19c.75 1.334-.213 2.98-1.742 2.98H3.72c-1.53 0-2.492-1.646-1.743-2.98l6.28-11.19zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"
        clip-rule="evenodd"
      />
      } @case ('danger') {
      <path
        fill-rule="evenodd"
        d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z"
        clip-rule="evenodd"
      />
      } @default {
      <path
        fill-rule="evenodd"
        d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
        clip-rule="evenodd"
      />
      } }
    </svg>
    <div class="min-w-0 flex-1">
      @if (toast.title) {
      <p [class]="titleClasses">{{ toast.title }}</p>
      }
      <p [class]="messageClasses">{{ toast.message }}</p>
    </div>
    @if (toast.closable) {
    <button
      type="button"
      [class]="closeButtonClasses"
      aria-label="Dismiss notification"
      (click)="dismiss(toast.id)"
    >
      <svg
        width="14"
        height="14"
        viewBox="0 0 20 20"
        fill="currentColor"
        [attr.aria-hidden]="true"
      >
        <path
          fill-rule="evenodd"
          d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
    }
  </div>
  }
</div>
