<button
  [type]="type()"
  [class]="classes()"
  [dgPt]="ptFor('root')"
  [disabled]="isDisabled()"
  [attr.aria-busy]="loading() ? 'true' : null"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-current]="ariaCurrent() ?? null"
  [attr.role]="role() ?? null"
  [attr.aria-checked]="ariaChecked() ?? null"
  [attr.aria-pressed]="ariaPressed() ?? null"
  [attr.tabindex]="tabIndexOverride() ?? null"
>
  <span [class]="iconWrapperClasses()">
    @if (loading()) {
    <dg-spinner size="sm" />
    } @else {
    <ng-content select="[icon]" />
    }
  </span>
  <ng-content />
</button>
