<button
  [type]="type()"
  [class]="classes()"
  [disabled]="isDisabled()"
  [attr.aria-busy]="loading() ? 'true' : null"
>
  @if (loading()) {
    <span
      class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-current border-t-transparent"
      [attr.aria-hidden]="true"
    ></span>
  }
  <ng-content />
</button>
