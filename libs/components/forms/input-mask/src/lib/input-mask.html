<input
  type="text"
  inputmode="text"
  [class]="inputClasses()"
  [value]="displayValue()"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  [readOnly]="readOnly()"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [attr.aria-readonly]="readOnly() ? 'true' : null"
  [attr.aria-label]="ariaLabel() ?? null"
  (input)="onInput($event)"
  (keydown)="onKeydown($event)"
  (paste)="onPaste($event)"
  (focus)="onFocus($event)"
  (blur)="onBlur($event)"
/>
