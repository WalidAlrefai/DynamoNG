<label [class]="rootClasses()" [for]="inputId" [dgPt]="ptFor('root')">
  <input
    type="checkbox"
    role="switch"
    [class]="inputClasses()"
    [id]="inputId"
    [name]="name() ?? null"
    [checked]="checked()"
    [disabled]="disabled()"
    [attr.aria-checked]="checked()"
    [attr.aria-describedby]="ariaDescribedby() ?? null"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-readonly]="readOnly() ? 'true' : null"
    [attr.aria-label]="ariaLabel() ?? null"
    [dgPt]="ptFor('input')"
    (change)="onNativeChange($event)"
    (blur)="onBlur()"
  />
  <span
    [class]="trackClasses()"
    [attr.aria-hidden]="true"
    [dgPt]="ptFor('track')"
  >
    <span [class]="thumbClasses()" [dgPt]="ptFor('thumb')"></span>
  </span>
  <span [class]="labelClasses()" [dgPt]="ptFor('label')">
    <ng-content />
  </span>
</label>
