<div [class]="rootClasses()">
  <div [class]="toolbarClasses" role="toolbar" aria-label="Formatting">
    <button
      type="button"
      [class]="buttonClasses('bold')"
      [disabled]="disabled()"
      [attr.aria-pressed]="isActive('bold')"
      aria-label="Bold"
      (click)="onFormat('bold')"
    >
      <span class="font-bold">B</span>
    </button>
    <button
      type="button"
      [class]="buttonClasses('italic')"
      [disabled]="disabled()"
      [attr.aria-pressed]="isActive('italic')"
      aria-label="Italic"
      (click)="onFormat('italic')"
    >
      <span class="italic">I</span>
    </button>
    <button
      type="button"
      [class]="buttonClasses('underline')"
      [disabled]="disabled()"
      [attr.aria-pressed]="isActive('underline')"
      aria-label="Underline"
      (click)="onFormat('underline')"
    >
      <span class="underline">U</span>
    </button>
    <button
      type="button"
      [class]="buttonClasses('insertUnorderedList')"
      [disabled]="disabled()"
      [attr.aria-pressed]="isActive('insertUnorderedList')"
      aria-label="Bulleted list"
      (click)="onFormat('insertUnorderedList')"
    >
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true">
        <circle cx="2" cy="4" r="1" fill="currentColor" stroke="none" />
        <circle cx="2" cy="8" r="1" fill="currentColor" stroke="none" />
        <circle cx="2" cy="12" r="1" fill="currentColor" stroke="none" />
        <line x1="6" y1="4" x2="14" y2="4" stroke-width="1.5" stroke-linecap="round" />
        <line x1="6" y1="8" x2="14" y2="8" stroke-width="1.5" stroke-linecap="round" />
        <line x1="6" y1="12" x2="14" y2="12" stroke-width="1.5" stroke-linecap="round" />
      </svg>
    </button>
    <button
      type="button"
      [class]="buttonClasses('insertOrderedList')"
      [disabled]="disabled()"
      [attr.aria-pressed]="isActive('insertOrderedList')"
      aria-label="Numbered list"
      (click)="onFormat('insertOrderedList')"
    >
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true">
        <text x="0.5" y="5.5" font-size="4" fill="currentColor" stroke="none">1</text>
        <text x="0.5" y="9.5" font-size="4" fill="currentColor" stroke="none">2</text>
        <text x="0.5" y="13.5" font-size="4" fill="currentColor" stroke="none">3</text>
        <line x1="6" y1="4" x2="14" y2="4" stroke-width="1.5" stroke-linecap="round" />
        <line x1="6" y1="8" x2="14" y2="8" stroke-width="1.5" stroke-linecap="round" />
        <line x1="6" y1="12" x2="14" y2="12" stroke-width="1.5" stroke-linecap="round" />
      </svg>
    </button>
    <button
      type="button"
      [class]="buttonClasses('createLink')"
      [disabled]="disabled()"
      aria-label="Insert link"
      (click)="onLink()"
    >
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true">
        <path
          d="M6.5 9.5a2.5 2.5 0 0 0 3.54 0l1.5-1.5a2.5 2.5 0 0 0-3.54-3.54l-.86.86"
          stroke-width="1.5"
          stroke-linecap="round"
        />
        <path
          d="M9.5 6.5a2.5 2.5 0 0 0-3.54 0l-1.5 1.5a2.5 2.5 0 0 0 3.54 3.54l.86-.86"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </div>
  <div
    #contentEl
    [class]="contentClasses()"
    role="textbox"
    aria-multiline="true"
    [attr.aria-label]="ariaLabel() ?? null"
    [attr.aria-invalid]="invalid() ? true : null"
    [attr.contenteditable]="disabled() ? null : true"
    (input)="onInput($event)"
    (blur)="onBlur()"
  ></div>
</div>
