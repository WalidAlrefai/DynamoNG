<label [class]="rootClasses()" [for]="inputId">
  <input
    type="checkbox"
    class="peer sr-only"
    [id]="inputId"
    [checked]="checked()"
    [indeterminate]="indeterminate()"
    [disabled]="disabled()"
    [attr.aria-checked]="indeterminate() ? 'mixed' : null"
    (change)="onNativeChange($event)"
  />
  <span [class]="boxClasses()" [attr.aria-hidden]="true">
    @if (indeterminate()) {
      <span class="block h-0.5 w-2.5 bg-current"></span>
    } @else if (checked()) {
      <svg viewBox="0 0 16 16" class="h-3 w-3 fill-current">
        <path d="M6.5 11.5 3 8l1.4-1.4L6.5 8.7l5.1-5.1L13 5z" />
      </svg>
    }
  </span>
  <span class="text-sm">
    <ng-content />
  </span>
</label>
