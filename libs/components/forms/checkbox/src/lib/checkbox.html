<label [class]="rootClasses()" [for]="inputId">
  <input
    type="checkbox"
    class="peer sr-only"
    [id]="inputId"
    [checked]="checked()"
    [indeterminate]="indeterminate()"
    [disabled]="disabled()"
    [attr.aria-checked]="indeterminate() ? 'mixed' : null"
    (change)="onNativeChange($event)"
  />
  <span [class]="boxClasses()" [attr.aria-hidden]="true">
    @if (indeterminate()) {
    <span class="block h-0.5 w-2.5 bg-current"></span>
    } @else if (checked()) {
    <dg-icon-check [size]="size()" />
    }
  </span>
  <span class="text-sm">
    <ng-content />
  </span>
</label>
