<input
  [type]="type()"
  [class]="inputClasses()"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  [readOnly]="readOnly()"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [attr.aria-readonly]="readOnly() ? 'true' : null"
  [attr.aria-label]="ariaLabel() ?? null"
  [value]="value()"
  (input)="onInput($event)"
  (blur)="onBlur()"
/>
