<div [attr.data-testid]="'DynamoFileUpload'">
  <!--
    The native file input is a sibling, not a child, of the dropzone -- axe's
    nested-interactive rule (rightly) flags any real interactive control
    nested inside a role="button" container, and screen readers can still
    land on it via touch exploration even when aria-hidden. It only ever
    exists to be triggered programmatically by openBrowser(), so it doesn't
    need to be inside the visual dropzone box at all.
  -->
  <input
    #fileInputEl
    type="file"
    class="hidden"
    tabindex="-1"
    aria-hidden="true"
    [multiple]="multiple()"
    [attr.accept]="accept() ?? null"
    [disabled]="disabled()"
    (change)="onInputChange($event)"
  />

  <div
    #dropzoneEl
    role="button"
    [tabindex]="disabled() ? -1 : 0"
    [class]="dropzoneClasses()"
    [attr.aria-disabled]="disabled() ? 'true' : null"
    [attr.aria-label]="ariaLabel() ?? label()"
    (click)="openBrowser()"
    (keydown)="onDropzoneKeydown($event)"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <p>{{ label() }}</p>
  </div>

  @if (value().length > 0) {
    <ul [class]="fileListClasses">
      @for (file of value(); track file) {
        <li [class]="fileItemClasses">
          <span [class]="fileNameClasses">{{ file.name }}</span>
          <span [class]="fileSizeClasses">{{ formatSize(file.size) }}</span>
          <button
            type="button"
            [class]="removeButtonClasses"
            [attr.aria-label]="'Remove ' + file.name"
            [disabled]="disabled()"
            (click)="removeFile(file)"
          >
            <svg
              width="12"
              height="12"
              viewBox="0 0 20 20"
              fill="currentColor"
              [attr.aria-hidden]="true"
            >
              <path
                fill-rule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
        </li>
      }
    </ul>
  }
</div>
