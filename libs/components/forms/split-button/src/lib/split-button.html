<div [class]="rootClasses()">
  <dg-button
    type="button"
    [severity]="severity()"
    [variant]="variant()"
    [size]="size()"
    [disabled]="isPrimaryDisabled()"
    [styleClass]="primaryClasses()"
    [dgPt]="ptFor('primary')"
    (click)="onPrimaryClick()"
  >
    {{ label() }}
  </dg-button>

  <button
    #triggerEl
    type="button"
    aria-haspopup="menu"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="ariaLabel() ?? 'More actions'"
    [attr.aria-describedby]="ariaDescribedby() ?? null"
    [disabled]="isMenuDisabled()"
    [class]="triggerClasses()"
    [dgPt]="ptFor('trigger')"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
  >
    <svg
      [attr.aria-hidden]="true"
      width="16"
      height="16"
      viewBox="0 0 16 16"
      fill="none"
    >
      <path
        d="M4 6l4 4 4-4"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  <ng-template #panelTemplate>
    <div
      role="menu"
      tabindex="-1"
      [class]="panelClasses()"
      [dgPt]="ptFor('panel')"
      (keydown)="onPanelKeydown($event)"
    >
      @for (item of items(); track item) { @if (item.separator()) {
      <li
        role="separator"
        #itemButton
        [hidden]="!item.visible()"
        [attr.aria-hidden]="!item.visible() ? 'true' : null"
        [class]="separatorClasses"
        [dgPt]="ptFor('item')"
      ></li>
      } @else if (item.routerLink()) {
      <a
        #itemButton
        role="menuitem"
        tabindex="-1"
        [hidden]="!item.visible()"
        [attr.aria-hidden]="!item.visible() ? 'true' : null"
        [attr.aria-disabled]="item.disabled() ? 'true' : null"
        [class]="itemClasses(item)"
        [dgPt]="ptFor('item')"
        [routerLink]="item.disabled() ? null : (item.routerLink() ?? null)"
        [queryParams]="item.queryParams()"
        [fragment]="item.fragment()"
        (click)="onItemClick(item)"
      >
        <ng-container
          [ngTemplateOutlet]="itemContent"
          [ngTemplateOutletContext]="{ $implicit: item }"
        />
      </a>
      } @else {
      <button
        #itemButton
        type="button"
        role="menuitem"
        tabindex="-1"
        [hidden]="!item.visible()"
        [attr.aria-hidden]="!item.visible() ? 'true' : null"
        [attr.aria-disabled]="item.disabled() ? 'true' : null"
        [class]="itemClasses(item)"
        [dgPt]="ptFor('item')"
        (click)="onItemClick(item)"
      >
        <ng-container
          [ngTemplateOutlet]="itemContent"
          [ngTemplateOutletContext]="{ $implicit: item }"
        />
      </button>
      } }
    </div>
  </ng-template>

  <ng-template #itemContent let-item>
    <span [class]="itemLeadingClasses">
      @if (item.icon()) {
      <span aria-hidden="true">{{ item.icon() }}</span>
      }
      <span>{{ item.label() }}</span>
    </span>
    <span [class]="itemTrailingClasses">
      @if (item.shortcut()) {
      <span [class]="shortcutClasses" aria-hidden="true"
        >{{ item.shortcut() }}</span
      >
      } @if (item.badge() !== undefined) {
      <dg-badge size="sm">{{ item.badge() }}</dg-badge>
      }
    </span>
  </ng-template>
</div>
