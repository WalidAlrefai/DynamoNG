<div [class]="rootClasses()">
  <dg-button
    type="button"
    [severity]="severity()"
    [variant]="variant()"
    [size]="size()"
    [disabled]="disabled()"
    [styleClass]="primaryClasses"
    (click)="onPrimaryClick()"
  >
    {{ label() }}
  </dg-button>

  <button
    #triggerEl
    type="button"
    aria-haspopup="menu"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="ariaLabel() ?? 'More actions'"
    [disabled]="disabled()"
    [class]="triggerClasses()"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
  >
    <svg
      [attr.aria-hidden]="true"
      width="16"
      height="16"
      viewBox="0 0 16 16"
      fill="none"
    >
      <path
        d="M4 6l4 4 4-4"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  <ng-template #panelTemplate>
    <div
      role="menu"
      tabindex="-1"
      [class]="panelClasses"
      (keydown)="onPanelKeydown($event)"
    >
      @for (item of items(); track item) {
        <button
          #itemButton
          type="button"
          role="menuitem"
          tabindex="-1"
          [attr.aria-disabled]="item.disabled() ? 'true' : null"
          [class]="itemClasses(item)"
          (click)="onItemClick(item)"
        >
          {{ item.label() }}
        </button>
      }
    </div>
  </ng-template>
</div>
