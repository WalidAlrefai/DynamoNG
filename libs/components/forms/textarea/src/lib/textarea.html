<textarea
  #textareaEl
  [class]="textareaClasses()"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  [readOnly]="readOnly()"
  [rows]="rows()"
  [attr.cols]="cols() ?? null"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [attr.aria-readonly]="readOnly() ? 'true' : null"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-describedby]="ariaDescribedby() ?? null"
  [dgPt]="ptFor('textarea')"
  [value]="value()"
  (input)="onInput($event)"
  (blur)="onBlur()"
></textarea>
