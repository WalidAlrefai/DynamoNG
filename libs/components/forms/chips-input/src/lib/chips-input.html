<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- click-through-to-focus convenience only; the real interactive element (the input below) is already natively focusable via Tab -->
<div
  [class]="wrapperClasses()"
  [attr.data-testid]="'DynamoChipsInput'"
  (click)="onWrapperClick()"
>
  @for (chip of chips(); track chip; let i = $index) {
    <span [class]="chipClasses()" [attr.data-testid]="'DynamoChipsInput-chip'">
      {{ chip }}
      <button
        type="button"
        [class]="removeButtonClasses"
        [attr.aria-label]="'Remove ' + chip"
        [disabled]="disabled()"
        (click)="removeChip(i); $event.stopPropagation()"
      >
        <svg
          width="10"
          height="10"
          viewBox="0 0 20 20"
          fill="currentColor"
          [attr.aria-hidden]="true"
        >
          <path
            fill-rule="evenodd"
            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </span>
  }
  <input
    #input
    type="text"
    [class]="fieldClasses"
    [value]="draftText()"
    [placeholder]="chips().length === 0 ? placeholder() : ''"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel() ?? null"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    (input)="onInputInput($event)"
    (keydown)="onInputKeydown($event)"
    (paste)="onInputPaste($event)"
    (blur)="onInputBlur()"
  />
</div>
