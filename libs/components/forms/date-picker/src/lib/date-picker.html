@if (!inline()) {
<button
  #triggerEl
  type="button"
  [id]="triggerId"
  aria-haspopup="dialog"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="open() ? dialogId : null"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-invalid]="invalid() ? true : null"
  [attr.aria-readonly]="readOnly() ? true : null"
  [class]="triggerClasses()"
  [disabled]="disabled()"
  (click)="toggle()"
  (keydown)="onTriggerKeydown($event)"
>
  <span>{{ triggerLabel() }}</span>
  <svg
    [attr.aria-hidden]="true"
    width="16"
    height="16"
    viewBox="0 0 16 16"
    fill="none"
  >
    <rect
      x="2"
      y="3"
      width="12"
      height="11"
      rx="1.5"
      stroke="currentColor"
      stroke-width="1.5"
    />
    <path
      d="M2 6.5h12M5 1.5v3M11 1.5v3"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
    />
  </svg>
</button>
@if (clearable() && value()) {
<button
  type="button"
  [class]="clearButtonClasses"
  [disabled]="disabled()"
  aria-label="Clear selection"
  (click)="clearValue($event)"
>
  <svg
    width="12"
    height="12"
    viewBox="0 0 20 20"
    fill="currentColor"
    [attr.aria-hidden]="true"
  >
    <path
      fill-rule="evenodd"
      d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
      clip-rule="evenodd"
    />
  </svg>
</button>
} } @if (inline()) {
<ng-container [ngTemplateOutlet]="panelTemplate" />
}

<ng-template #panelTemplate>
  <div
    [attr.role]="inline() ? null : 'dialog'"
    [id]="inline() ? null : dialogId"
    [attr.aria-label]="inline() ? null : (ariaLabel() ?? null)"
    [attr.aria-labelledby]="
      inline() || ariaLabel() ? null : monthLabelId
    "
    [attr.aria-modal]="inline() ? null : false"
    tabindex="-1"
    [class]="panelClasses"
    (keydown)="onPanelKeydown($event)"
  >
    <div class="mb-2 flex items-center justify-between">
      <button
        type="button"
        aria-label="Previous month"
        [class]="headerButtonClasses"
        (click)="navigateMonth(-1)"
      >
        <svg
          [attr.aria-hidden]="true"
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
        >
          <path
            d="M10 3l-5 5 5 5"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <div [id]="monthLabelId" class="text-sm font-semibold text-text-primary">
        {{ monthLabel() }}
      </div>
      <button
        type="button"
        aria-label="Next month"
        [class]="headerButtonClasses"
        (click)="navigateMonth(1)"
      >
        <svg
          [attr.aria-hidden]="true"
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
        >
          <path
            d="M6 3l5 5-5 5"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>

    <table role="grid" [attr.aria-labelledby]="monthLabelId">
      <thead>
        <tr role="row">
          @for (label of weekdayLabels(); track label) {
          <th role="columnheader" scope="col" [class]="weekdayClasses">
            {{ label }}
          </th>
          }
        </tr>
      </thead>
      <tbody>
        @for (week of weeks(); track $index) {
        <tr role="row">
          @for (day of week; track day.getTime()) {
          <td
            role="gridcell"
            [attr.aria-selected]="isSelected(day) ? 'true' : null"
          >
            <button
              #dayButton
              type="button"
              [attr.tabindex]="inline() && isFocused(day) ? 0 : -1"
              [attr.aria-current]="isToday(day) ? 'date' : null"
              [disabled]="isDisabled(day)"
              [class]="dayClasses(day)"
              (click)="selectDay(day)"
            >
              {{ day.getDate() }}
            </button>
          </td>
          }
        </tr>
        }
      </tbody>
    </table>
  </div>
</ng-template>
