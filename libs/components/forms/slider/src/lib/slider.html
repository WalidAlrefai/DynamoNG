<div [class]="rootClasses()" [dgPt]="ptFor('root')">
  <div
    #track
    [class]="trackClasses()"
    [dgPt]="ptFor('track')"
    [style.height.px]="orientation() === 'vertical' ? verticalHeight() : null"
    (pointerdown)="onTrackPointerDown($event)"
    (pointermove)="onTrackPointerMove($event)"
    (pointerup)="onTrackPointerUp()"
    (pointercancel)="onTrackPointerUp()"
  >
    @for (tick of ticks(); track tick) {
    <span
      [class]="tickClasses()"
      [style]="percentStyle(tickPercent(tick))"
      [dgPt]="ptFor('tick')"
    ></span>
    @if (showTickLabels()) {
    <span
      [class]="tickLabelClasses()"
      [style]="percentStyle(tickPercent(tick))"
      [dgPt]="ptFor('tickLabel')"
      >{{ tick }}</span
    >
    } } @if (range()) {
    <div
      [class]="fillClasses()"
      [style]="fillStyle()"
      [dgPt]="ptFor('fill')"
    ></div>
    <div
      #minThumb
      role="slider"
      data-thumb="min"
      [tabindex]="disabled() ? -1 : 0"
      [class]="thumbClasses()"
      [style]="thumbStyle('min')"
      [dgPt]="ptFor('thumb')"
      [attr.aria-valuenow]="currentMin()"
      [attr.aria-valuemin]="min()"
      [attr.aria-valuemax]="currentMax()"
      [attr.aria-orientation]="orientation()"
      [attr.aria-disabled]="disabled() ? 'true' : null"
      [attr.aria-readonly]="readOnly() ? 'true' : null"
      [attr.aria-label]="minThumbLabel()"
      [attr.aria-describedby]="ariaDescribedby() ?? null"
      (keydown)="onThumbKeydown('min', $event)"
      (pointerdown)="onThumbPointerDown('min', $event)"
    >
      @if (showTooltipFor('min')) {
      <span [class]="tooltipClasses()">{{ currentMin() }}</span>
      }
    </div>
    <div
      #maxThumb
      role="slider"
      data-thumb="max"
      [tabindex]="disabled() ? -1 : 0"
      [class]="thumbClasses()"
      [style]="thumbStyle('max')"
      [dgPt]="ptFor('thumb')"
      [attr.aria-valuenow]="currentMax()"
      [attr.aria-valuemin]="currentMin()"
      [attr.aria-valuemax]="max()"
      [attr.aria-orientation]="orientation()"
      [attr.aria-disabled]="disabled() ? 'true' : null"
      [attr.aria-readonly]="readOnly() ? 'true' : null"
      [attr.aria-label]="maxThumbLabel()"
      [attr.aria-describedby]="ariaDescribedby() ?? null"
      (keydown)="onThumbKeydown('max', $event)"
      (pointerdown)="onThumbPointerDown('max', $event)"
    >
      @if (showTooltipFor('max')) {
      <span [class]="tooltipClasses()">{{ currentMax() }}</span>
      }
    </div>
    } @else {
    <div
      [class]="fillClasses()"
      [style]="fillStyle()"
      [dgPt]="ptFor('fill')"
    ></div>
    <div
      #thumb
      role="slider"
      [tabindex]="disabled() ? -1 : 0"
      [class]="thumbClasses()"
      [style]="thumbStyle('min')"
      [dgPt]="ptFor('thumb')"
      [attr.aria-valuenow]="clampedValue()"
      [attr.aria-valuemin]="min()"
      [attr.aria-valuemax]="max()"
      [attr.aria-orientation]="orientation()"
      [attr.aria-disabled]="disabled() ? 'true' : null"
      [attr.aria-readonly]="readOnly() ? 'true' : null"
      [attr.aria-label]="ariaLabel() ?? 'Slider'"
      [attr.aria-describedby]="ariaDescribedby() ?? null"
      (keydown)="onThumbKeydown('min', $event)"
    >
      @if (showTooltipFor('min')) {
      <span [class]="tooltipClasses()">{{ clampedValue() }}</span>
      }
    </div>
    }
  </div>
</div>
