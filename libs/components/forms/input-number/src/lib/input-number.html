<div [class]="wrapperClasses()">
  <button
    type="button"
    tabindex="-1"
    [class]="buttonClasses()"
    [disabled]="decrementDisabled()"
    aria-label="Decrement"
    (click)="decrement()"
  >
    <ng-content select="[decrementIcon]">&minus;</ng-content>
  </button>
  @if (prefix(); as prefixText) {
  <span [class]="affixClasses" data-testid="dg-input-number-prefix"
    >{{ prefixText }}</span
  >
  }
  <input
    type="text"
    inputmode="decimal"
    role="spinbutton"
    [class]="inputClasses"
    [value]="displayValue()"
    [attr.aria-valuenow]="value()"
    [attr.aria-valuemin]="min() ?? null"
    [attr.aria-valuemax]="max() ?? null"
    [attr.aria-label]="ariaLabel() ?? null"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-readonly]="readOnly() ? 'true' : null"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [readOnly]="readOnly()"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (keydown)="onKeydown($event)"
  />
  @if (suffix(); as suffixText) {
  <span [class]="affixClasses" data-testid="dg-input-number-suffix"
    >{{ suffixText }}</span
  >
  }
  <button
    type="button"
    tabindex="-1"
    [class]="buttonClasses()"
    [disabled]="incrementDisabled()"
    aria-label="Increment"
    (click)="increment()"
  >
    <ng-content select="[incrementIcon]">+</ng-content>
  </button>
</div>
