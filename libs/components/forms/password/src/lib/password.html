<div [class]="wrapperClasses()">
  <input
    [type]="inputType()"
    [class]="inputClasses"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-label]="ariaLabel() ?? null"
    [attr.aria-describedby]="showStrengthMeter() ? meterId : null"
    [value]="value()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
  <button
    type="button"
    [class]="toggleButtonClasses"
    [disabled]="disabled()"
    [attr.aria-label]="toggleLabel()"
    (click)="toggleVisibility()"
  >
    @if (visible()) {
      <svg
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path
          d="M2 2l12 12M6.5 6.7A2 2 0 008 10a2 2 0 001.6-3.2M4.2 4.2C2.6 5.2 1.4 6.6 1 8c1 3 4 5.5 7 5.5 1 0 2-.2 2.9-.6M9.9 3.1C9.3 3 8.7 3 8 3c-.5 0-1 .05-1.5.15"
          stroke-width="1.3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    } @else {
      <svg
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path
          d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"
          stroke-width="1.3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="8" cy="8" r="2" stroke-width="1.3" />
      </svg>
    }
  </button>
</div>
@if (showStrengthMeter()) {
  <div [id]="meterId" class="mt-1.5 flex items-center gap-2">
    <!-- `<dg-progress>`'s host element is unstyled (its `styleClass` input
    merges into an inner div, not the host), so it defaults to `display:
    inline` and won't size itself in a flex row — wrap it in a real block
    element to establish the flex-1 width the inner track's `w-full` fills. -->
    <div class="flex-1">
      <dg-progress
        [value]="strength().percent"
        [severity]="strength().severity"
        size="sm"
        [ariaLabel]="'Password strength: ' + strength().label"
      />
    </div>
    <span class="text-xs text-text-muted capitalize">{{ strength().label }}</span>
  </div>
}
