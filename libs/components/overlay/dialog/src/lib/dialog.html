@if (open()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-surface-900/50" [attr.aria-hidden]="true" (click)="onBackdropClick()"></div>
    <div
      #panel
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      [class]="panelClasses()"
      [attr.aria-label]="ariaLabel() ?? null"
      [attr.aria-labelledby]="!ariaLabel() && title() ? titleId : null"
      (keydown.escape)="onEscape()"
    >
      @if (title()) {
        <div class="mb-4 flex items-center justify-between gap-4">
          <h2 [id]="titleId" class="text-lg font-semibold text-text-primary">{{ title() }}</h2>
          <button type="button" [class]="closeButtonClasses" (click)="close()" aria-label="Close dialog">
            <svg viewBox="0 0 16 16" class="h-3.5 w-3.5 fill-current" [attr.aria-hidden]="true">
              <path
                d="M3.6 2.5 2.5 3.6 6.9 8l-4.4 4.4 1.1 1.1L8 9.1l4.4 4.4 1.1-1.1L9.1 8l4.4-4.4-1.1-1.1L8 6.9z"
              />
            </svg>
          </button>
        </div>
      }
      <ng-content />
    </div>
  </div>
}
