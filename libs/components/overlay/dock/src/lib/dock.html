<div [class]="rootClasses()" [dgPt]="ptFor('root')" data-testid="DynamoDock">
  <ul
    role="menu"
    tabindex="-1"
    [attr.aria-label]="ariaLabel() ?? null"
    [attr.aria-describedby]="ariaDescribedby() ?? null"
    [attr.aria-orientation]="isVertical() ? 'vertical' : 'horizontal'"
    [class]="listClasses()"
    [dgPt]="ptFor('list')"
    (mousemove)="onPointerMove($event)"
    (mouseleave)="resetScale()"
    (keydown)="onKeydown($event)"
  >
    @for (item of items(); track item; let i = $index) {
    <li role="none">
      <button
        #tileEl
        type="button"
        role="menuitem"
        [tabindex]="focusedIndex() === i ? 0 : -1"
        [attr.aria-disabled]="item.disabled ? 'true' : null"
        [attr.aria-label]="
            item.badge !== undefined
              ? item.label + ' (' + item.badge + ')'
              : item.label
          "
        [class]="itemClasses()"
        [dgPt]="ptFor('item')"
        [style.transform]="tileTransform(i)"
        (click)="run(i)"
      >
        <span
          [class]="iconClasses()"
          [dgPt]="ptFor('icon')"
          [attr.aria-hidden]="true"
        >
          {{ item.icon ?? item.label.charAt(0) }}
        </span>
        @if (item.badge !== undefined) {
        <span
          [class]="badgeClasses()"
          [dgPt]="ptFor('badge')"
          [attr.aria-hidden]="true"
        >
          {{ item.badge }}
        </span>
        }
        <span
          [class]="labelClasses()"
          [dgPt]="ptFor('label')"
          [attr.aria-hidden]="true"
        >
          {{ item.label }}
        </span>
      </button>
    </li>
    }
  </ul>
</div>
