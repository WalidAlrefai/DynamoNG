<span
  #triggerEl
  tabindex="-1"
  [class]="triggerClasses()"
  [dgPt]="triggerPt()"
  (mouseenter)="onMouseEnter($event)"
  (mousemove)="onMouseMove($event)"
  (mouseleave)="onMouseLeave()"
  (focusin)="onFocusIn()"
  (focusout)="onFocusOut()"
  (keydown.escape)="onEscape()"
>
  <ng-content />
</span>

<ng-template #tooltipTemplate>
  <div
    role="tooltip"
    [id]="contentId"
    [class]="panelClasses()"
    [dgPt]="ptFor('panel')"
  >
    {{ content() }} @if (!mouseTrack()) {
    <div
      [class]="arrowClasses()"
      [dgPt]="ptFor('arrow')"
      [attr.aria-hidden]="true"
    ></div>
    }
  </div>
</ng-template>
