<span
  #triggerEl
  tabindex="-1"
  [class]="triggerClasses()"
  [dgPt]="triggerPt()"
  (click)="toggle()"
  (keydown)="onTriggerKeydown($event)"
>
  <ng-content select=":not(dg-popover-content)" />
</span>

<ng-template #panelTemplate>
  <div
    #panel
    role="dialog"
    [attr.aria-modal]="true"
    [id]="panelId"
    tabindex="-1"
    data-testid="popover-panel"
    [attr.aria-label]="ariaLabel() ?? 'Popover'"
    [class]="panelClasses()"
    [dgPt]="ptFor('panel')"
    (keydown.escape)="onEscape()"
  >
    <ng-container [ngTemplateOutlet]="content().contentTemplate()" />
  </div>
</ng-template>
