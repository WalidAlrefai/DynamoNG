<div class="pointer-events-none fixed inset-0 z-50 flex items-center justify-center p-4">
  <div
    #panel
    role="alertdialog"
    aria-modal="true"
    tabindex="-1"
    class="pointer-events-auto"
    [class]="panelClasses"
    [attr.aria-labelledby]="request().title ? titleId : null"
    [attr.aria-describedby]="request().title ? messageId : null"
    [attr.aria-label]="!request().title ? request().message : null"
  >
    @if (request().title) {
      <h2 [id]="titleId" class="text-lg font-semibold text-text-primary">
        {{ request().title }}
      </h2>
    }
    <p [id]="messageId" class="mt-2 text-sm text-text-secondary">
      {{ request().message }}
    </p>
    <div class="mt-4 flex justify-end gap-2">
      <dg-button variant="text" (click)="onCancel()">{{
        request().cancelLabel
      }}</dg-button>
      <dg-button [severity]="request().severity" (click)="onConfirm()">{{
        request().confirmLabel
      }}</dg-button>
    </div>
  </div>
</div>
