<nav [attr.aria-label]="ariaLabel() ?? 'Breadcrumb'">
  <ol [class]="listClasses()">
    @for (item of items(); track item; let i = $index; let last = $last) {
      <li [class]="itemClasses">
        @if (last) {
          <span [class]="currentClasses" aria-current="page">{{
            item.label
          }}</span>
        } @else if (item.href) {
          <a [href]="item.href" [class]="linkClasses">{{ item.label }}</a>
        } @else {
          <span [class]="plainClasses">{{ item.label }}</span>
        }
        @if (!last) {
          <span [class]="separatorClasses" aria-hidden="true">/</span>
        }
      </li>
    }
  </ol>
</nav>
