<div [class]="rootClasses()">
  <div [class]="tablistRowClasses()">
    @if (scrollable() && showNavigators()) {
    <button
      type="button"
      [class]="scrollNavButtonClasses({ disabled: false })"
      [attr.aria-label]="scrollNavAriaLabel(-1)"
      (click)="scrollTablist(-1)"
    >
      <svg
        [class]="scrollNavIconClasses()"
        [attr.aria-hidden]="true"
        width="14"
        height="14"
        viewBox="0 0 16 16"
        fill="none"
      >
        <path
          d="M10 3l-5 5 5 5"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
    }
    <div
      #tablist
      role="tablist"
      tabindex="-1"
      [id]="tabsId"
      [class]="tablistClasses()"
      [attr.aria-label]="ariaLabel() ?? null"
      [style.width.px]="orientation() === 'vertical' ? verticalWidth() : null"
      (keydown)="onTablistKeydown($event)"
    >
      @for (tab of tabs(); track tab; let i = $index) {
      <button
        #tabButton
        type="button"
        role="tab"
        [id]="tabId(i)"
        [attr.aria-controls]="panelId(i)"
        [attr.aria-selected]="isActive(tab)"
        [attr.aria-disabled]="tab.disabled() ? 'true' : null"
        [attr.aria-keyshortcuts]="tab.closable() ? 'Delete' : null"
        [tabindex]="isActive(tab) ? 0 : -1"
        [class]="tabClasses(tab)"
        (click)="onTabClick(tab, i)"
      >
        {{ tab.label() }} @if (tab.closable()) {
        <!--
          Deliberately NOT a `role="tab"` sibling under the tablist, and NOT
          its own focusable `role="button"` — either would violate
          `role="tablist"`'s aria-required-children constraint (only
          `role="tab"` may live directly under it). It's a mouse-only click
          target nested inside the tab itself; keyboard users close the
          focused tab with Delete/Backspace instead (`onTablistKeydown`,
          announced via this tab's own `aria-keyshortcuts` above).
        -->
        <span
          [class]="closeButtonClasses"
          [attr.aria-hidden]="true"
          [attr.data-tab-close]="tabId(i)"
          (click)="onCloseClick($event, tab)"
        >
          <svg
            width="12"
            height="12"
            viewBox="0 0 20 20"
            fill="currentColor"
            [attr.aria-hidden]="true"
          >
            <path
              fill-rule="evenodd"
              d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
              clip-rule="evenodd"
            />
          </svg>
        </span>
        }
      </button>
      }
    </div>
    @if (scrollable() && showNavigators()) {
    <button
      type="button"
      [class]="scrollNavButtonClasses({ disabled: false })"
      [attr.aria-label]="scrollNavAriaLabel(1)"
      (click)="scrollTablist(1)"
    >
      <svg
        [class]="scrollNavIconClasses()"
        [attr.aria-hidden]="true"
        width="14"
        height="14"
        viewBox="0 0 16 16"
        fill="none"
      >
        <path
          d="M6 3l5 5-5 5"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
    }
  </div>

  @for (tab of tabs(); track tab; let i = $index) { @if (tab.hasBeenActivated())
  {
  <div
    role="tabpanel"
    [id]="panelId(i)"
    [attr.aria-labelledby]="tabId(i)"
    [hidden]="!isActive(tab)"
    [class]="panelClasses()"
    tabindex="0"
  >
    <ng-container [ngTemplateOutlet]="tab.contentTemplate()" />
  </div>
  } }
</div>
