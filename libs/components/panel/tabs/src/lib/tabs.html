<div [class]="rootClasses()">
  <div [class]="tablistRowClasses">
    @if (scrollable() && showNavigators()) {
    <button
      type="button"
      [class]="scrollNavButtonClasses({ disabled: false })"
      aria-label="Scroll tabs left"
      (click)="scrollTablist(-1)"
    >
      <svg
        [attr.aria-hidden]="true"
        width="14"
        height="14"
        viewBox="0 0 16 16"
        fill="none"
      >
        <path
          d="M10 3l-5 5 5 5"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
    }
    <div
      #tablist
      role="tablist"
      tabindex="-1"
      [id]="tabsId"
      [class]="tablistClasses()"
      [attr.aria-label]="ariaLabel() ?? null"
      (keydown)="onTablistKeydown($event)"
    >
      @for (tab of tabs(); track tab; let i = $index) {
      <button
        #tabButton
        type="button"
        role="tab"
        [id]="tabId(i)"
        [attr.aria-controls]="panelId(i)"
        [attr.aria-selected]="isActive(tab)"
        [attr.aria-disabled]="tab.disabled() ? 'true' : null"
        [tabindex]="isActive(tab) ? 0 : -1"
        [class]="tabClasses(tab)"
        (click)="onTabClick(tab, i)"
      >
        {{ tab.label() }}
      </button>
      }
    </div>
    @if (scrollable() && showNavigators()) {
    <button
      type="button"
      [class]="scrollNavButtonClasses({ disabled: false })"
      aria-label="Scroll tabs right"
      (click)="scrollTablist(1)"
    >
      <svg
        [attr.aria-hidden]="true"
        width="14"
        height="14"
        viewBox="0 0 16 16"
        fill="none"
      >
        <path
          d="M6 3l5 5-5 5"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
    }
  </div>

  @for (tab of tabs(); track tab; let i = $index) { @if (tab.hasBeenActivated())
  {
  <div
    role="tabpanel"
    [id]="panelId(i)"
    [attr.aria-labelledby]="tabId(i)"
    [hidden]="!isActive(tab)"
    [class]="panelClasses"
    tabindex="0"
  >
    <ng-container [ngTemplateOutlet]="tab.contentTemplate()" />
  </div>
  } }
</div>
