<span
  [class]="rootClasses()"
  [dgPt]="ptFor('root')"
  role="img"
  [attr.aria-label]="altText()"
  [attr.aria-labelledby]="ariaLabelledBy() ?? null"
  [attr.aria-describedby]="ariaDescribedby() ?? null"
>
  @if (showImage()) {
  <img
    [src]="src()"
    [alt]="altText()"
    (error)="onImageError($event)"
    [class]="imageClasses()"
    [dgPt]="ptFor('image')"
  />
  } @else if (displayLabel()) {
  <span
    [class]="labelOrInitialsPt().class"
    [dgPt]="labelOrInitialsPt()"
    [attr.aria-hidden]="true"
  >
    {{ displayLabel() }}
  </span>
  } @else {
  <span
    [class]="iconClasses()"
    [dgPt]="ptFor('icon')"
    [attr.aria-hidden]="true"
  >
    <ng-content select="[icon]">
      <svg viewBox="0 0 24 24" class="h-3/5 w-3/5 fill-current">
        <path
          d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12Zm0 2.5c-3.4 0-10 1.7-10 5.1v2.2h20v-2.2c0-3.4-6.6-5.1-10-5.1Z"
        />
      </svg>
    </ng-content>
  </span>
  }
</span>
