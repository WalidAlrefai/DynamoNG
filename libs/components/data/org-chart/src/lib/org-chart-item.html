<div
  role="treeitem"
  [class]="boxClasses()"
  [dgPt]="ptFor('node')"
  [attr.data-node-id]="node().id"
  data-testid="DynamoOrgChart-node"
  [tabindex]="focusable() ? 0 : -1"
  [attr.aria-expanded]="hasChildren() ? !collapsed() : null"
  [attr.aria-selected]="state.selectable() ? selected() : null"
  [attr.aria-disabled]="node().disabled ? 'true' : 'false'"
  (click)="onBoxClick()"
  (keydown)="onBoxKeydown($event)"
>
  @if (state.template(); as tpl) {
  <ng-container
    [ngTemplateOutlet]="tpl"
    [ngTemplateOutletContext]="{ $implicit: node(), node: node() }"
  />
  } @else { {{ node().label }} }
</div>

@if (showToggler()) {
<span
  [class]="togglerClasses()"
  [dgPt]="ptFor('toggler')"
  data-testid="DynamoOrgChart-toggler"
  [attr.aria-hidden]="true"
  (click)="onToggle($event)"
>
  <svg
    aria-hidden="true"
    width="14"
    height="14"
    viewBox="0 0 16 16"
    fill="none"
  >
    <path
      d="M4 6l4 4 4-4"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</span>
} @if (childrenVisible()) {
<div role="group" [class]="groupClasses()" [dgPt]="ptFor('group')">
  @for (child of node().children; track child.id) {
  <dg-org-chart-item [node]="child" [pt]="pt()" />
  }
</div>
}
