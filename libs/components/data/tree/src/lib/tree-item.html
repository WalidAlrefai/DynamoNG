<div
  role="treeitem"
  [class]="rowClasses()"
  [tabindex]="isActive() ? 0 : -1"
  [attr.aria-selected]="ariaSelectedAttr()"
  [attr.aria-expanded]="isExpandable() ? isExpanded() : null"
  [attr.aria-checked]="state.selectionMode() === 'checkbox' ? ariaCheckedAttr() : null"
  [attr.aria-disabled]="node().disabled ? 'true' : null"
  [attr.aria-level]="depth() + 1"
  [attr.aria-posinset]="posinset()"
  [attr.aria-setsize]="setsize()"
  [attr.data-node-id]="node().id"
  [style.paddingLeft.rem]="indentRem()"
  [dgPt]="ptFor('row')"
  (click)="onRowClick()"
  (focus)="onRowFocus()"
  (keydown)="state.handleKeydown($event)"
>
  @if (node().loading) {
  <span
    [class]="chevronButtonClasses()"
    data-testid="chevron-spinner"
    [attr.aria-hidden]="true"
    [dgPt]="ptFor('chevronButton')"
  >
    <dg-spinner size="sm" />
  </span>
  } @else if (isExpandable()) {
  <button
    type="button"
    tabindex="-1"
    data-testid="chevron"
    [class]="chevronButtonClasses()"
    [attr.aria-label]="chevronLabel()"
    [dgPt]="ptFor('chevronButton')"
    (click)="onChevronClick($event)"
  >
    <svg
      [class]="chevronClasses()"
      [attr.aria-hidden]="true"
      width="16"
      height="16"
      viewBox="0 0 16 16"
      fill="none"
      [dgPt]="ptFor('chevron')"
    >
      <path
        d="M4 6l4 4 4-4"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
  } @else {
  <span [class]="chevronPlaceholderClasses" [attr.aria-hidden]="true"></span>
  } @if (state.selectionMode() === 'checkbox') {
  <span #checkboxHost>
    <dg-checkbox
      size="sm"
      [checked]="checkboxChecked()"
      [indeterminate]="isIndeterminate()"
      [disabled]="node().disabled ?? false"
      [pt]="{ root: ptFor('checkbox') }"
      (checkedChange)="onCheckedChange()"
      (click)="onCheckboxContainerClick($event)"
    />
  </span>
  } @if (nodeTemplate()) {
  <ng-container
    [ngTemplateOutlet]="nodeTemplate() ?? null"
    [ngTemplateOutletContext]="nodeContext()"
  />
  } @else {
  <span [class]="labelClasses()" [dgPt]="ptFor('label')"
    >{{ node().label }}</span
  >
  }
</div>
@if (renderChildren() && isExpandable() && isExpanded()) {
<div role="group" [class]="groupClasses()" [dgPt]="ptFor('group')">
  <div [class]="groupInnerClasses">
    @for (child of node().children; track child.id; let i = $index) {
    <dg-tree-item
      [node]="child"
      [depth]="depth() + 1"
      [posinset]="i + 1"
      [setsize]="node().children!.length"
      [pt]="pt()"
      [nodeTemplate]="nodeTemplate()"
    />
    }
  </div>
</div>
}
