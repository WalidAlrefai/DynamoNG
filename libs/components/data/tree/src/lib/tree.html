@if (items().length > 0) {
  <div
    [class]="rootClasses()"
    role="tree"
    aria-multiselectable="true"
    [attr.aria-label]="ariaLabel() ?? null"
    [attr.aria-busy]="loading() ? 'true' : null"
  >
    @for (node of items(); track node.id; let i = $index) {
      <dg-tree-item
        [node]="node"
        [depth]="0"
        [posinset]="i + 1"
        [setsize]="items().length"
      />
    }
  </div>
} @else {
  <!--
    Not nested inside role="tree" — axe's aria-required-children rule (rightly)
    flags a plain <div> as an invalid child of role="tree" (only role="treeitem"/
    "group" satisfy it), and there's nothing to navigate when there are no
    items anyway, so the tree role itself is simply omitted while empty.
  -->
  <div
    [class]="emptyStateClasses"
    role="status"
    [attr.aria-label]="ariaLabel() ?? null"
    [attr.aria-busy]="loading() ? 'true' : null"
  >
    @if (loading()) {
      <dg-spinner size="sm" />
      <span>{{ loadingMessage() }}</span>
    } @else {
      <span>{{ emptyMessage() }}</span>
    }
  </div>
}
