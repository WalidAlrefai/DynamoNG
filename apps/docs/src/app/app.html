<div class="mx-auto flex h-screen max-w-7xl gap-8 p-8">
  <nav class="flex w-48 shrink-0 flex-col">
    <a routerLink="/" class="mb-4 block shrink-0 text-lg font-bold text-text-primary">DynamoNG</a>
    <div class="mb-4 shrink-0 space-y-1">
      <a
        routerLink="/components"
        routerLinkActive="bg-surface-100 text-primary"
        class="block rounded-md px-3 py-1.5 text-sm text-text-primary hover:bg-surface-100"
      >
        Components
      </a>
      <a
        routerLink="/templates"
        routerLinkActive="bg-surface-100 text-primary"
        class="block rounded-md px-3 py-1.5 text-sm text-text-primary hover:bg-surface-100"
      >
        Templates
      </a>
    </div>
    <div class="min-h-0 flex-1 overflow-y-auto">
      @for (group of groupedComponents; track group.category) {
        <h3 class="mb-1 mt-4 px-3 text-xs font-semibold uppercase tracking-wide text-text-muted first:mt-0">
          {{ group.category }}
        </h3>
        <ul class="space-y-1">
          @for (entry of group.entries; track entry.slug) {
            <li>
              <a
                [routerLink]="['/components', entry.slug]"
                routerLinkActive="bg-surface-100 text-primary"
                class="block rounded-md px-3 py-1.5 text-sm text-text-primary hover:bg-surface-100"
              >
                {{ entry.name }}
              </a>
            </li>
          }
        </ul>
      }
    </div>
  </nav>
  <div class="min-w-0 flex-1 overflow-y-auto">
    <router-outlet />
  </div>
</div>
